# Github action configuration build and pack pdf library
# Author: Rahul Shukla <rahul.shukla@ilimi.in>

name: Sunbird-PDF-Player

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest   # note: lowercase per runner naming
    strategy:
      matrix:
        node-version: [20]  # modern LTS; see note below

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build pdf player library
        run: npm run build

      - name: Package pdf player library
        working-directory: dist/pdf-player-v2
        run: npm pack

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: library-generation
          path: |
            dist/pdf-player-v2
          if-no-files-found: error
          retention-days: 7
